name: CI

# NOTE: push-triggered runs have historically never fired on this repository.
# From the repo's creation (8 Apr 2026) until 30 Jul 2026 the only workflow run
# on record was a manual dispatch — which is why `workflow_dispatch` was added
# the same day the repo was created ("fix: add workflow_dispatch trigger to CI").
# Everything checkable is identical to the sibling SDK repos that do trigger on
# push: workflow state active, valid `on:` block, regular file mode, Actions
# enabled with allowed_actions=all, no rulesets, push events delivered and
# visible in the repo event feed. If push runs are still missing, toggle Actions
# off and on in repo settings to re-wire the trigger, and escalate to GitHub
# Support if that doesn't take — do not assume the workflow file is at fault.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
      - run: composer install --no-interaction
      - run: vendor/bin/phpstan analyse

  test:
    name: Test (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer
          coverage: xdebug
      - run: composer install --no-interaction
      - run: vendor/bin/phpunit --coverage-text

  notify-packagist:
    name: Notify Packagist
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Notify Packagist
        run: |
          # The API needs the repository URL as a JSON *payload*; passing it as
          # a query parameter returns {"status":"error","message":"Missing
          # payload parameter"}. That was the previous shape, and because
          # `curl -s` exits 0 on an API-level error the step reported success
          # while never notifying anything — releases only reached Packagist
          # whenever its periodic crawl happened to pick them up.
          response=$(curl -sS -XPOST \
            -H "API-TOKEN: ${{ secrets.PACKAGIST_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"repository":{"url":"https://github.com/signdocsbrasil/signdocs-brasil-php"}}' \
            "https://packagist.org/api/update-package?username=signdocsbrasil")
          echo "$response"
          # Fail loudly rather than let a broken notification look like a
          # release: a green step that published nothing is worse than a red one.
          echo "$response" | grep -q '"status":"success"' || {
            echo "::error::Packagist did not accept the update"
            exit 1
          }
